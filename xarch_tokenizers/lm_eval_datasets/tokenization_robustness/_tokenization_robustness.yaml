tag: 
  - multilingual
  - tokenization
  - evaluation
task: tokenization_robustness
dataset_path: json
dataset_name: null
dataset_kwargs:
  data_files: 
    test: data/custom_dataset_hf.json

test_split: test
output_type: generate_until

doc_to_text: "{{ question }}"
doc_to_target: "{{ answer }}"

generation_kwargs:
  temperature: 0.0  # Use 0 to get deterministic outputs
  do_sample: False
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"

filter_list:
  - filter:
    - function: regex
      regex_pattern: "(.+)"  # Capture everything
    - function: take_first   # Take the first match
    name: basic-extraction

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
  - metric: multi_target_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
  # Add a custom filter+metric for checking against all targets
  # # Custom metric that organizes results by tokenization type
  # - metric: group_exact_match
  #   groups: tokenization_type
  #   aggregation: mean
  #   higher_is_better: true
  #   ignore_case: true
  #   ignore_punctuation: true
  
  # # Custom metric that organizes results by category
  # - metric: group_exact_match
  #   groups: category
  #   aggregation: mean
  #   higher_is_better: true
  #   ignore_case: true
  #   ignore_punctuation: true

repeats: 1

metadata:
  version: 0.0
  description: "Evaluation of model performance across different tokenization variants"
  num_fewshot: 0  # Zero-shot evaluation
task: tokenization_robustness
tag: 
  - multilingual
  - tokenization
  - evaluation
dataset_path: json
dataset_kwargs:
  data_files: 
    test: data/custom_dataset_hf.json
test_split: test
output_type: generate_until

doc_to_text: "{{ question }}"
# Keep your multi-target setup for exact matching
doc_to_target: "{{all_targets}}"
target_delimiter: "||"

generation_kwargs:
  temperature: 0.0
  do_sample: false
  max_new_tokens: 50
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"

filter_list:
  - filter:
    - function: regex
      regex_pattern: "(.+)"
    - function: take_first
    name: basic-extraction

metric_list:
  # Generation-based metrics
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
  - metric: multi_target_match
    aggregation: mean  
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
  # Perplexity metrics (calculated on target text)
  - metric: word_perplexity
    aggregation: mean
    higher_is_better: false
  - metric: byte_perplexity  
    aggregation: mean
    higher_is_better: false
  - metric: bits_per_byte
    aggregation: mean
    higher_is_better: false
repeats: 1

metadata:
  version: 0.1
  description: "Evaluation of model performance across different tokenization variants"
  num_fewshot: 0  # Zero-shot evaluation
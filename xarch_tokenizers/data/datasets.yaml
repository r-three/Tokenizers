# Dataset Registry Configuration
# Math Datasets
openai/gsm8k:
  name: gsm8k
  registry: math
  samples: 7473
  classes: null
  task_type: generation
  max_seq_length: 512
  hf_config: main
  splits:
    train: train
    validation: test
  metrics:
    - exact_match
  max_gen_seq_length: 128
  input_field: question
  label_field: answer

juletxara/mgsm:
  name: mgsm
  registry: multilingual
  samples: 2838  # 258*11
  classes: null
  task_type: generation
  max_seq_length: 512
  hf_config: main
  splits:
    train: train
    validation: test
  metrics:
    - exact_match
  trust_remote_code: true
  max_gen_seq_length: 128
  input_field: question
  label_field: answer
  languages:
    - bn
    - de
    - en
    - es
    - fr
    - ja
    - ru
    - sw
    - te
    - th
    - zh
  instruction_format:
    instruction: ""
    user_format: "{question}"
    user_input: question
    assistant_output: answer_number
    # assistant_output: answer
    answer_len: medium
  
EleutherAI/hendrycks_math:
  name: math
  registry: math
  samples: 1744
  classes: null
  task_type: generation
  max_seq_length: 2048
  hf_config: algebra
  splits:
    train: train
    validation: test
  metrics:
    - exact_match
  input_field: problem
  label_field: solution
  additional_fields:
    - level
    - type


allenai/math_qa:
  name: mathqa
  registry: math
  samples: 29838
  classes: 5
  task_type: generation
  max_seq_length: 512
  splits:
    train: train
    validation: validation
    test: test
  metrics:
    - accuracy
    - f1
  trust_remote_code: true

EleutherAI/asdiv:
  name: asdiv
  registry: math
  samples: 1839
  classes: null
  task_type: generation
  max_seq_length: 256
  splits:
    validation: validation
  metrics:
    - exact_match
  trust_remote_code: true


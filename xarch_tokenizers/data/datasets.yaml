# GLUE Benchmark Datasets
nyu-mll/glue:
  name: glue
  registry: glue
  configs:
    cola:
      samples: 8551
      classes: 2
      task_type: classification
      max_seq_length: 128
      metrics:
        - matthews_correlation
        - accuracy
      input_field: sentence
      label_field: label
    sst2:
      samples: 67349
      classes: 2
      task_type: classification
      max_seq_length: 128
      metrics:
        - accuracy
      input_field: sentence
      label_field: label
    mrpc:
      samples: 3668
      classes: 2
      task_type: sequence_pair
      max_seq_length: 128
      metrics:
        - accuracy
        - f1
      input_field:
        - sentence1
        - sentence2
      label_field: label
    qqp:
      samples: 363849
      classes: 2
      task_type: sequence_pair
      max_seq_length: 128
      metrics:
        - accuracy
        - f1
      input_field:
        - question1
        - question2
      label_field: label
    mnli:
      samples: 392702
      classes: 3
      task_type: natural_language_inference
      max_seq_length: 128
      splits:
        train: train
        validation: validation_matched
        test: test_matched
      metrics:
        - accuracy
      input_field:
        - premise
        - hypothesis
      label_field: label
    qnli:
      samples: 104743
      classes: 2
      task_type: natural_language_inference
      max_seq_length: 128
      metrics:
        - accuracy
      input_field:
        - question
        - sentence
      label_field: label
    rte:
      samples: 2490
      classes: 2
      task_type: natural_language_inference
      max_seq_length: 128
      metrics:
        - accuracy
      input_field:
        - sentence1
        - sentence2
      label_field: label
    wnli:
      samples: 635
      classes: 2
      task_type: natural_language_inference
      max_seq_length: 128
      metrics:
        - accuracy
      input_field:
        - sentence1
        - sentence2
      label_field: label
    stsb:
      samples: 5749
      classes: 1
      task_type: regression
      max_seq_length: 128
      splits:
        train: train
        validation: validation
        test: test_matched
      metrics:
        - pearson_correlation
        - spearman_correlation
      input_field:
        - sentence1
        - sentence2
      label_field: label


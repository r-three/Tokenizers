## run with eval
datasets:
  - name: juletxara/mgsm
    subset: en
  - name: juletxara/mgsm
    subset: zh
  - name: juletxara/mgsm
    subset: de
  - name: juletxara/mgsm
    subset: fr
model_name: &model_name meta-llama/Meta-Llama-3.1-8B-Instruct
tokenizer_name: &tokenizer_name meta-llama/Meta-Llama-3.1-8B-Instruct
trust_remote_code: true
revision: null

use_wandb: true
wandb_project: xarch-multilingual
experiment_name: "mgsm-eval-Llama-3.1-8B-Instruct"  
log_level: INFO

seed: 42
evaluation_method: lm_eval
num_fewshot: 0
apply_chat_template: true
num_samples: 2

load_existing: false
save_dir: debug/Llama-3.1-8B-Instruct
lm_eval_task:
  dataset_name: tokenization_robustness_completion
  task: tokenization_robustness_completion
  # group: tokenizer_robustness
  dataset_path: parquet
  # tag:
  #   - tokenizer_robustness
  output_type: multiple_choice
  training_split: null
  validation_split: null
  doc_to_text:  '{{ question.strip() }}'
  # doc_to_target: '{{answer_label }}'
  doc_to_target: "answer"  # Changed from '{{answer_label}}' to field name
  doc_to_choice: "choices"  # Changed from null to actual field name
  test_split: test
  # fewshot_split: dev
  num_fewshot: 0
  metric_list:
    - metric: acc
      aggregation: mean
      higher_is_better: true
    - metric: acc_norm
      aggregation: mean
      higher_is_better: true
  aggregate_metric_list:
    - metric: acc
      aggregation: mean
      weight_by_size: true
    - metric: acc_norm
      aggregation: mean
      weight_by_size: true
  metadata:
    version: "1.0.2"
    description: "Tokenization robustness evaluation dataset"

